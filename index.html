<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111614">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Manual">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Manual de Ser Humano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#EEF1EC; --surface:#FFFFFF; --surface2:#E4E9E2; --ink:#18221E; --muted:#5F6B65; --line:#D3DAD2;
  --accent:#2C6A4D; --accent-soft:#D6E8DC; --gold:#B7862A; --gold-soft:#F4E8CC; --warn:#B8701F; --warn-soft:#F5E6D0; --bad:#B03E36; --bad-soft:#F5DAD6;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#111614;--surface:#19201C;--surface2:#232C27;--ink:#E4EBE6;--muted:#95A29B;--line:#2C3731;
  --accent:#6CC095;--accent-soft:#1F3A2C;--gold:#E2B55A;--gold-soft:#3A301A;--warn:#E3A45A;--warn-soft:#3A2C1A;--bad:#E57B72;--bad-soft:#3D211E;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#111614;--surface:#19201C;--surface2:#232C27;--ink:#E4EBE6;--muted:#95A29B;--line:#2C3731;
  --accent:#6CC095;--accent-soft:#1F3A2C;--gold:#E2B55A;--gold-soft:#3A301A;--warn:#E3A45A;--warn-soft:#3A2C1A;--bad:#E57B72;--bad-soft:#3D211E;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding:0 16px 100px}
.wrap{max-width:680px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

header{padding-block:18px 10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header h1{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
header .sub{color:var(--muted);font-size:13px;margin-top:2px}
.streak{display:flex;align-items:center;gap:6px;background:var(--gold-soft);color:var(--gold);border-radius:99px;padding:5px 11px;font-weight:600;white-space:nowrap}
.streak svg{width:15px;height:15px}
.lvl{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.lvl .badge{font-family:var(--display);font-weight:800;font-size:13px;background:var(--ink);color:var(--bg);border-radius:8px;padding:3px 8px;white-space:nowrap}
.lvl .xpbar{flex:1;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.lvl .xpbar i{display:block;height:100%;background:var(--gold);transition:width .4s}
.lvl small{font-size:12px;color:var(--muted);white-space:nowrap}
.banner{background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.banner b{color:var(--warn)}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav .in{display:flex;max-width:680px;width:100%;gap:4px}
nav button{flex:1;background:none;border:0;padding:10px 2px;font-size:13px;font-weight:600;color:var(--muted);border-radius:10px}
nav button[aria-current="true"]{color:var(--accent);background:var(--accent-soft)}

section.view{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:17px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.today{display:flex;align-items:center;gap:16px}
.today b{font-family:var(--display);font-size:44px;font-weight:800;line-height:1}
.today .meta{flex:1;display:flex;flex-direction:column;gap:6px}
.pbar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);transition:width .3s}

.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 0}
.group>.gh{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px 4px}
.group>.gh h3{font-size:16px;font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.group>.gh+.row,.list>.row:first-child{border-top:0}
.chk{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:none;flex:none;display:grid;place-items:center;padding:0}
.chk svg{width:14px;height:14px;opacity:0}
.row.done .chk{background:var(--accent);border-color:var(--accent)}
.row.done .chk svg{opacity:1}
.row.done .t{color:var(--muted);text-decoration:line-through}
.row.fail .chk{border-color:var(--bad);background:var(--bad-soft)}
.row .t{flex:1;min-width:0}
.row .xp{font-size:11px;color:var(--gold);font-weight:600}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.tag.must{background:var(--bad-soft);color:var(--bad)}
.tag.p{background:var(--surface2);color:var(--muted)}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.tag.wait{background:var(--surface2);color:var(--muted)}
.counter{display:flex;align-items:center;gap:8px}
.counter button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-weight:600}
.drops{display:flex;gap:3px}
.drops i{width:8px;height:14px;border-radius:2px 2px 4px 4px;background:var(--surface2)}
.drops i.on{background:var(--accent)}
.sub2{font-size:12px;color:var(--muted)}

.sleep{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
input[type=time],input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;min-height:42px;display:block}
.btn{white-space:nowrap}
.sleep label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;font:inherit;color:inherit;resize:vertical}
input[type=text],input[type=date],input[type=time],select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%}
.btn{background:var(--accent);color:var(--bg);border:0;border-radius:10px;padding:9px 14px;font-weight:600}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.small{padding:6px 11px;font-size:13px}
.btn.danger{background:var(--bad-soft);color:var(--bad)}

.avisos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.avisos li{display:flex;gap:10px;align-items:baseline;font-size:14px}
.avisos .when{font-size:12px;font-weight:600;color:var(--accent);min-width:78px}
.avisos li.hj .when{color:var(--warn)}

.sand{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sand h2{font-size:21px;font-weight:800;letter-spacing:-.01em}
.sand.spin h2{animation:spin .5s ease}
@keyframes spin{0%{opacity:.2;transform:translateY(-6px)}100%{opacity:1;transform:none}}
details summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent)}
.list{margin-top:6px}

.forgot form{display:flex;gap:8px;flex-wrap:wrap}
.forgot input[type=text]{flex:1 1 180px;width:auto}
.forgot select{width:auto}
.flist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.flist li{background:var(--bad-soft);border-radius:10px;padding:8px 12px;display:flex;gap:8px;justify-content:space-between;align-items:center;font-size:14px}
.x{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px}

/* calendário */
.caltop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.caltop h2{font-size:20px;font-weight:800;flex:1;min-width:140px;text-transform:capitalize}
.iconbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.month .dh{font-size:11px;text-align:center;color:var(--muted);font-weight:600;padding-bottom:4px;text-transform:uppercase}
.mc{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:66px;padding:4px;display:flex;flex-direction:column;gap:2px;text-align:left;overflow:hidden}
.mc.out{opacity:.4}
.mc.tod{border-color:var(--accent)}
.mc.sel{background:var(--accent-soft);border-color:var(--accent)}
.mc .d{font-size:12px;font-weight:600}
.mc .ev{font-size:10px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:3px;padding:0 3px;background:var(--surface2)}
.mc .more{font-size:10px;color:var(--muted)}
.wk{display:flex;flex-direction:column;gap:8px}
.wkd{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.wkd.tod{border-color:var(--accent)}
.wkd .hd{display:flex;justify-content:space-between;align-items:center}
.wkd .hd b{font-family:var(--display);font-size:15px;text-transform:capitalize}
.evi{display:flex;gap:10px;align-items:center;background:var(--surface2);border:0;border-radius:8px;padding:7px 10px;text-align:left;width:100%}
.evi .tm{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:38px}
.evi .tt{flex:1;min-width:0;font-size:14px}
.pd{width:8px;height:8px;border-radius:50%;flex:none}
.pd.saude,.ev.saude{background:var(--accent-soft)} .pd.saude{background:var(--accent)}
.pd.namorado{background:#C0567A} .ev.namorado{background:#F3DCE5}
.pd.filho{background:#3F72B5} .ev.filho{background:#DCE6F5}
.pd.organizado{background:var(--gold)} .ev.organizado{background:var(--gold-soft)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ev.namorado{background:#3E2230}:root:not([data-theme="light"]) .ev.filho{background:#1E2A3D}}
:root[data-theme="dark"] .ev.namorado{background:#3E2230} :root[data-theme="dark"] .ev.filho{background:#1E2A3D}

/* sheet */
.sheet{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet form{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet form>*{grid-column:1/-1}
.sheet .half{grid-column:auto}
.sheet h3{font-size:18px}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end}

/* sucesso */
.hero{display:flex;gap:16px;align-items:center}
.hero .big{width:74px;height:74px;border-radius:18px;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.hero .big b{font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.hero .big small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;text-align:center;opacity:.7}
.hero h2{font-size:22px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:10px;padding:8px 10px}
.stat b{font-family:var(--display);font-size:22px;display:block;line-height:1.1}
.stat span{font-size:11px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;gap:5px;align-items:center}
.wd .col{width:100%;max-width:34px;height:80px;background:var(--surface2);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden;position:relative}
.wd .col i{display:block;width:100%;background:var(--accent)}
.wd .col i.lo{background:var(--warn)}
.wd .col::after{content:"";position:absolute;left:0;right:0;bottom:80%;border-top:1px dashed var(--muted);opacity:.5}
.wd small{font-size:11px;color:var(--muted)}
.wd.tod small{color:var(--accent);font-weight:700}
.sleepc .col{height:90px}
.sleepc .col::after{bottom:70%}
.sleepc .col i{background:#5B6FB5}
.sleepc .col i.lo{background:var(--warn)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 6px;text-align:center;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;white-space:nowrap}
thead th{border-top:0;font-size:11px;color:var(--muted);font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%}
.dot.y{background:var(--accent)}.dot.n{background:var(--bad)}.dot.f{border:1.5px solid var(--line)}
.alert{background:var(--bad-soft);border-radius:10px;padding:8px 12px;font-size:14px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.bd{border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;background:var(--surface2);opacity:.55}
.bd.on{background:var(--gold-soft);opacity:1}
.bd b{font-size:14px}
.bd span{font-size:12px;color:var(--muted)}
.bd.on b{color:var(--gold)}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.nrow{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.q{background:var(--surface2);border-radius:10px;padding:10px 12px;font-style:italic}
.nt{font-weight:600}
.chkl{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.chkl input{width:18px;height:18px}
.stats.s4{grid-template-columns:repeat(2,1fr)}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.inline{display:flex;gap:8px}.inline input{flex:1}
.trip{background:var(--surface2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.stg{display:flex;gap:10px;align-items:center;font-size:13px}
.stg .chk{width:24px;height:24px}
.stg.done .chk{background:var(--accent);border-color:var(--accent)}.stg.done .chk svg{opacity:1}
.stg.late span{color:var(--bad)}
.sync{font-size:11px;color:var(--muted);text-align:center;margin-top:16px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-weight:600;font-size:14px;z-index:20;pointer-events:none;transition:opacity .3s,transform .3s}
.toast[data-off]{opacity:0;transform:translate(-50%,8px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
.gate{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;align-items:center;justify-content:center;padding:24px}
.gcard{max-width:360px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center}
.gcard h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
.gcard .btn{padding:12px 16px;font-size:16px}
.bk{background:var(--warn-soft)}
.evi.ok .tt,.evi.lost .tt{text-decoration:line-through;color:var(--muted)}
.evi.moved{opacity:.6}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.mc .ev.dn{text-decoration:line-through;opacity:.55}
.evrow{display:flex;gap:8px;align-items:center}
.evrow .evi{flex:1;min-width:0}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:none;flex:none;display:grid;place-items:center;padding:0}
.ck svg{width:13px;height:13px;opacity:0}
.ck.on{background:var(--accent);border-color:var(--accent)}.ck.on svg{opacity:1}
.avisos li .ck{width:24px;height:24px;align-self:center}
.linkb{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.linkb.dn{text-decoration:line-through;color:var(--muted)}
.stbox{background:var(--surface2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.stbox input[type=date]{background:var(--surface)}
.gform{display:flex;flex-direction:column;gap:10px}
input[type=email],input[type=password]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;font:inherit;color:inherit}
</style>
</head>
<body>
<div class="gate" id="gate" hidden><div class="gcard"><h1>Manual de Ser Humano</h1><p class="sub2">Entra na sua conta pra carregar seus dados.</p><form id="pwform" class="gform"><input type="email" id="lemail" placeholder="E-mail" autocomplete="username" required><input type="password" id="lpass" placeholder="Senha" autocomplete="current-password" required><button class="btn" type="submit">Entrar</button></form><button class="btn ghost" id="login">Entrar com Google</button><p class="sub2" id="gerr"></p></div></div>

<div class="wrap">
  <header>
    <div><h1>Manual de Ser Humano</h1><div class="sub" id="sub"></div></div>
    <div class="streak" id="streak" title="Dias seguidos com 80% ou mais"></div>
  </header>
  <div class="lvl"><span class="badge" id="lvlb"></span><div class="xpbar"><i id="xpbar"></i></div><small class="num" id="xptxt"></small></div>
  <div class="banner" id="banner" hidden></div>

  <section class="view" id="v-hoje"></section>
  <section class="view" id="v-cal" hidden></section>
  <section class="view" id="v-suc" hidden></section>
  <p class="sync" id="sync">salvando só neste aparelho</p>
</div>

<nav><div class="in">
  <button data-v="hoje" aria-current="true">Hoje</button>
  <button data-v="cal" aria-current="false">Calendário</button>
  <button data-v="suc" aria-current="false">Sucesso</button>
</div></nav>

<div class="sheet" id="sheet" hidden>
  <form id="evform">
    <h3 id="evh">Novo compromisso</h3>
    <div class="stbox" id="evst" hidden><div class="label" id="evstl"></div><div class="btns"><button type="button" class="btn small" data-est="feito">Feito</button><button type="button" class="btn small ghost" data-est="perdido">Perdido pra sempre</button><button type="button" class="btn small ghost" data-est="clear" id="estclear">Desfazer</button></div><div class="inline"><input type="date" id="evre" aria-label="Nova data"><button type="button" class="btn small ghost" data-est="move">Reagendar</button></div></div>
    <input type="hidden" id="evid">
    <input type="text" id="evt" placeholder="O quê?" required autocomplete="off" aria-label="Título">
    <input type="date" id="evd" class="half" required aria-label="Data">
    <input type="time" id="evtm" class="half" aria-label="Horário (opcional)">
    <select id="evp" class="half" aria-label="Pilar"></select>
    <select id="evr" class="half" aria-label="Repetição">
      <option value="none">Não repete</option><option value="daily">Todo dia</option><option value="weekly">Toda semana</option>
      <option value="monthly">Todo mês</option><option value="lastwd">Último mesmo dia da semana do mês</option><option value="semiannual">A cada 6 meses</option><option value="yearly">Todo ano</option>
    </select>

/* ---------- regras e pontos ---------- */
const applies=(h,k)=>h.d.includes(parse(k).getDay())&&(!h.from||k>=h.from);
function autoState(h,k){const dd=days[k];
  if(h.auto==='wake6'){const w=dd&&toMin(dd.acordei);if(w==null)return null;return w<=6*60}
  if(h.auto==='wake'){const w=dd&&toMin(dd.acordei);if(w==null)return null;return w<=8*60+30}
  if(h.auto==='gift'){const a=key(addD(parse(k),-6));return gifts.some(g=>g.created>=a&&g.created<=k&&g.status!=='escolhido')?true:null}
  if(h.auto==='prog'){return wkndPlanned(k)?true:null}
  if(h.auto==='bed'){const t=dd&&nightMin(dd.dormi);if(t==null)return null;return t<=nightMin(BED[parse(k).getDay()])}
}
function isDone(h,k){const dd=days[k];if(!dd)return false;
  if(h.auto)return autoState(h,k)===true;
  if(h.count)return (dd.agua||0)>=WATER;
  return !!(dd.checks||{})[h.id]}
function score(k){const hs=H.filter(h=>applies(h,k));const n=hs.filter(h=>isDone(h,k)).length;return {n,t:hs.length,p:hs.length?Math.round(n/hs.length*100):0}}
function dayXP(k){const dd=days[k];if(!dd)return 0;let x=0;
  for(const h of H) if(applies(h,k)&&isDone(h,k)) x+=h.xp||10;
  if(dd.acordei)x+=5; if(dd.dormi)x+=5;
  for(const h of H) if(h.penalty&&applies(h,k)&&autoState(h,k)===false) x-=h.penalty;
  if(dd.bonus)for(const v of Object.values(dd.bonus))x+=v;
  const s=score(k); if(s.p>=80)x+=25; if(s.p===100)x+=25; return x}
function firstDay(){if(TODAY>=START)return START;const ks=Object.keys(days).sort();return ks[0]||TODAY}
function range(a,b){const out=[];let d=parse(a);const e=parse(b);while(d<=e){out.push(key(d));d=addD(d,1)}return out}
function stats(){
  const ks=range(firstDay(),TODAY);let xp=0;for(const k of ks)xp+=dayXP(k);
  let best=0,run=0;for(const k of ks){if(k===TODAY)break;if(score(k).p>=80){run++;best=Math.max(best,run)}else run=0}
  let cur=run;if(score(TODAY).p>=80){cur++;best=Math.max(best,cur)}
  let li=0;for(let i=0;i<LEVELS.length;i++)if(xp>=LEVELS[i][0])li=i;
  return {xp,cur,best,li,ks}
}
function habitRun(id,ks,need){const h=H.find(x=>x.id===id);let run=0;for(const k of ks){if(!applies(h,k))continue;if(isDone(h,k)){run++;if(run>=need)return true}else if(k!==TODAY)run=0}return false}
function quartoStreak(){let n=0;let d=parse(TODAY);for(let i=0;i<60;i++){const q=(days[key(d)]||{}).quarto;if(q==='bag'){n++;d=addD(d,-1)}else if(q==null&&i===0){d=addD(d,-1)}else break}return n}

function orgPick(){const recent=[];for(let i=1;i<=6;i++){const o=(days[key(addD(parse(lastSun()),-7*i))]||{}).org;if(o&&o.area)recent.push(o.area)}
  const cur=((days[lastSun()]||{}).org||{}).area;let pool=QUARTO.filter(a=>!recent.includes(a)&&a!==cur);if(!pool.length)pool=QUARTO.filter(a=>a!==cur);return pool[Math.floor(Math.random()*pool.length)]}

  const teeth=(()=>{let run=0;for(const k of ks){const ok=['dentes_am','dentes_almoco','dentes_pm'].every(id=>isDone(H.find(h=>h.id===id),k));if(ok){run++;if(run>=7)return true}else if(k!==TODAY)run=0}return false})();

    ['Primeiro passo','Um dia com 80% ou mais',past.some(k=>score(k).p>=80)],
    ['Dia perfeito','Um dia com 100%',ks.some(k=>score(k).p===100)],
    ['Sequência de 3','3 dias seguidos acima de 80%',st.best>=3],
    ['Semana inteira','7 dias seguidos acima de 80%',st.best>=7],

  ];
}

/* ---------- calendário: ocorrências ---------- */
function occurs(ev,k){if(!ev.date||k<ev.date)return false;const r=ev.recur||'none';
  if(r==='none')return k===ev.date; if(r==='daily')return true;
  const a=parse(ev.date),b=parse(k);
  if(r==='weekly')return Math.round((b-a)/864e5)%7===0;
  if(r==='lastwd')return b.getDay()===a.getDay()&&addD(b,7).getMonth()!==b.getMonth();
  const mo=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();
  const step=r==='monthly'?1:r==='semiannual'?6:12; if(mo%step)return false;
  return addM(ev.date,mo)===k}
const evOn=k=>[...agenda.filter(e=>occurs(e,k)),...giftEvs(k)].sort((x,y)=>(x.time||'99:99')<(y.time||'99:99')?-1:1);

    const col=(name,fn)=>unsubs.push(fs.collection(name).onSnapshot({includeMetadataChanges:true},s=>{fn(s);st(s.metadata);soft()},e=>{if(e.code==='permission-denied'){denied()}else note('erro ao sincronizar: '+(e.code||e.message))}));
    col('days',s=>{s.docs.forEach(d=>{days[d.id]=clone(d.data())});lset('days',days)});
    col('weeks',s=>{s.docs.forEach(d=>{weeks[d.id]=clone(d.data())});lset('weeks',weeks)});
    col('lists',s=>{s.docs.forEach(d=>{lists[d.id]=clone(d.data())});lset('lists',lists)});
    col('gifts',s=>{gifts=s.docs.map(d=>clone(d.data()));lset('gifts',gifts)});
    col('trips',s=>{trips=s.docs.map(d=>clone(d.data()));lset('trips',trips)});
    col('agenda',s=>{agenda=s.docs.map(d=>clone(d.data()));lset('agenda',agenda)});
    unsubs.push(fs.doc('meta/backup').onSnapshot(d=>{const v=d.data();if(v&&v.at&&(!lastBkp||v.at>lastBkp)){lastBkp=v.at;lset('lastbkp',lastBkp);soft()}},()=>{}));
  }
  auth.onAuthStateChanged(u=>{
    unsubs.forEach(f=>f());unsubs=[];db=null;
    window.__user=u||null;
    if(!u){$('#gate').hidden=false;note('desconectado');return}
    $('#gate').hidden=true;gerr('');start()});
})();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
})();
</script>
